name: Build Android VirtualCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-ONVIF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "VirtualCam ONVIF v1.4.0"
          body: |
            ### 📷 VirtualCam ONVIF v1.4.0 - Aliran Audio Live (Media / Mic / Keduanya)
            - **Pilihan Sumber Audio Interaktif:** Kini tersedia pilihan aliran audio **Tanpa Audio**, **Audio Media** (suara file video MP4 / suara internal layar Android 10+), **Mikrofon (Mic HP)**, atau **Keduanya (Media + Mic digabung secara real-time)**.
            - **Dekoder Audio MP4 Tersinkronisasi (`Mp4AudioDecoder`):** Mengekstrak, downmix, dan resampling audio langsung dari file video MP4 agar jernih tanpa gema speaker saat dipadukan dengan mikrofon.
            - **Audio Internal Layar (`AudioPlaybackCapture`):** Menangkap suara game/aplikasi/browser saat mode *Screen Mirror* aktif (Android 10+).
            - **RTSP Multi-Track Video H.264 + Audio AAC (`RFC 3640`):** Mengirimkan audio AAC 44.1 kHz beserta *RTCP Sender Report* untuk sinkronisasi suara & gambar yang presisi di VLC, OBS Studio, FFmpeg, dan ONVIF NVR.
            - **Pemutar Audio Live di Browser (`http://<IP>:8080/`):** Dilengkapi tombol **🔊 Putar Audio Live** menggunakan Web Audio API (`/audio.pcm`) serta endpoint stream ADTS `/audio.aac`.
            - **Perbaikan Tambahan:** Sinkronisasi timestamp video-audio seragam (`System.nanoTime()`) saat video MP4 looping & reset `glClearColor` hitam pada *letterbox*.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
