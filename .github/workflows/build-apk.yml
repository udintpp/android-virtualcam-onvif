name: Build Android VirtualCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-ONVIF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "VirtualCam ONVIF v1.3.1"
          body: |
            ### 📷 VirtualCam ONVIF v1.3.1 - Perbaikan Layar Gelap (Black Screen Fix)
            - **Perbaikan Bentrok Kamera (Camera Hardware Collision):** Menghentikan `localCameraEngine` di MainActivity sebelum memulai `VirtualCamService` sehingga kamera fisik tidak terkunci (`ERROR_CAMERA_IN_USE`) dan dapat diambil alih dengan mulus oleh layanan streaming.
            - **Sinkronisasi Preview Layar HP:** Menghubungkan surface preview lokal ke `GlFrameDispatcher` saat streaming aktif, sehingga kamera/video tetap tampil bergerak di layar aplikasi.
            - **Perbaikan Timestamp MediaCodec Encoder (`eglPresentationTimeANDROID`):** Menambahkan pencatatan timestamp nano-detik sebelum `eglSwapBuffers`, menyelesaikan masalah frame yang dibuang oleh encoder H.264 sehingga RTSP (VLC / OBS) menampilkan video live yang jernih dan bergerak.
            - **Perbaikan Pemutaran Video SAF:** Menggunakan resolver `setDataSource(context, uri)` standar Android untuk file MP4 agar tidak mengalami error I/O `0x80000000`.
            - **Generator Pola Tes Mandiri OpenGL:** Pola warna SMPTE Color Bars kini dirender langsung di OpenGL ES tanpa `lockCanvas` ilegal.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
