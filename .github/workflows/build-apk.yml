name: Build Android VirtualCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-ONVIF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: "VirtualCam ONVIF v1.3.2"
          body: |
            ### 📷 VirtualCam ONVIF v1.3.2 - Perbaikan Aspek Rasio, Orientasi & Kontrol Rotasi/Cermin
            - **Anti-Distorsi Aspek Rasio (Fix Tarik / Pres):** Menambahkan perhitungan matriks MVP (Model-View-Projection) di shader OpenGL ES (`GlFrameDispatcher`) untuk menjaga proporsi asli video dan kamera tanpa melar atau gepeng.
            - **Orientasi Sensor Tegak Lurus (Upright Orientation):** Sensor kamera depan (270°) dan belakang (90°) kini dikoreksi secara otomatis sehingga wajah tampil tegak normal (tidak miring 90° ke samping).
            - **Tombol Kontrol Interaktif di Layar:**
              - 🔄 **Rotasi (0°, 90°, 180°, 270°):** Putar orientasi kamera/video secara instan langsung saat live streaming.
              - 🪞 **Cermin (Mirror On / Off):** Aktifkan atau matikan mode cermin selfie sesuai kenyamanan.
              - 📐 **Mode Skala (Fit Rasio Asli / Crop Layar Penuh):** Pilih tampilan letterbox berbingkai hitam atau crop memenuhi layar.
            - **Deteksi Otomatis Dimensi Video MP4:** Menyesuaikan aspek rasio file video (16:9 landscape, 9:16 portrait, atau 4:3) secara otomatis.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
