name: Build Android VirtualCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-ONVIF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "VirtualCam ONVIF v1.3.0"
          body: |
            ### 📷 VirtualCam ONVIF v1.3.0 - Perbaikan Crash & Tampilan Layar
            - **Perbaikan Force Close saat Mulai Streaming:** Mengisolasi Foreground Service lifecycle dengan tipe dinamis (`camera`, `mediaProjection`, `mediaPlayback`) serta pengaturan kompatibilitas Android 14+ (`targetSdk = 33`).
            - **Perbaikan Force Close saat Transmisi Layar:** Memperbaiki aliran otorisasi `MediaProjectionManager`, menambahkan `MediaProjection.Callback` (wajib di Android 14), dan mengganti `WindowManager.defaultDisplay` yang dilarang pada konteks service dengan `resources.displayMetrics`.
            - **Perbaikan Tampilan Media di Browser / Perangkat Lain:** Sinkronisasi `GlFrameDispatcher` input surface dengan `CountDownLatch`, perbaikan header MJPEG `boundary=frame`, dan header CORS.
            - **Crash Logger:** Menambahkan pencatat crash otomatis yang menyimpan jejak error ke `/sdcard/Download/virtualcam_crash.log`.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
