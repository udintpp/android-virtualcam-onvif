name: Build Android VirtualCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-ONVIF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "VirtualCam ONVIF v1.2.0"
          body: |
            ### 📷 VirtualCam ONVIF v1.2.0
            - **Web Browser Live Video Stream (MJPEG):** Sekarang saat diakses dari browser (Chrome, Edge, Safari di tablet/laptop/PC) pada port 8080 (`http://<IP>:8080/`), video live langsung tampil bergerak di halaman web!
            - **Perbaikan Rute Web:** Mengakses alamat root `/`, `/video`, maupun URL ONVIF melalui web browser akan menampilkan web player interaktif, bukan lagi layar putih kosong.
            - Menambahkan snapshot downloader langsung (`/snapshot.jpg`).
            ### 📷 VirtualCam ONVIF for Android
            Aplikasi Virtual Camera untuk Android dengan fitur:
            - Terdeteksi sebagai kamera sistem oleh aplikasi lain (Intent Camera Chooser).
            - Mendukung modul LSPosed/Xposed untuk aplikasi panggilan langsung (WhatsApp, Zoom, Meet, Chrome).
            - Sumber video: File MP4 lokal (looping) atau Rekam Layar (Screen Mirror MediaProjection).
            - ONVIF Device & Media Service (Port 8080) dengan WS-Discovery otomatis (UDP 3702).
            - Live RTSP H.264 Server (Port 8554) kompatibel dengan VLC, OBS, NVR CCTV.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
